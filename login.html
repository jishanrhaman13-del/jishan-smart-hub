<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JU MART Login</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="login-page">


<div class="login-box">


<h1>JU MART</h1>

<h2>Login / Signup</h2>


<p>Enter your mobile number</p>


<input 
type="tel" 
id="mobile"
placeholder="Enter Mobile Number"
maxlength="10">


<button id="sendOtp">
Send OTP
</button>



<div id="otpBox" style="display:none;">


<input 
type="number"
id="otp"
placeholder="Enter OTP">


<button id="verifyOtp">
Verify OTP
</button>


</div>


<p id="message"></p>


</div>


</div>


<script src="js/login.js"></script>


</body>

</html>
